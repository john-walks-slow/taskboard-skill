name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build release archives
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          fi
          export RELEASE_TAG="${TAG}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

          mkdir -p dist
          python - <<'PY'
          import os, zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          dist = Path("dist")

          def pack(out_path, src_dir, arc_prefix):
              with zipfile.ZipFile(out_path, "w", zipfile.ZIP_DEFLATED) as zf:
                  for p in sorted(Path(src_dir).rglob("*")):
                      if any(part in (".git", ".taskboard", "__pycache__", "dist") for part in p.parts):
                          continue
                      if p.suffix == ".pyc" or not p.is_file():
                          continue
                      arc = Path(arc_prefix) / p.relative_to(src_dir)
                      zi = zipfile.ZipInfo.from_file(p, str(arc))
                      if p.name == "taskboard":
                          zi.external_attr = (0o100755 & 0xFFFF) << 16
                      zf.writestr(zi, p.read_bytes())

          pack(dist / f"taskboard-skill-{tag}.zip", ".", "taskboard-skill")
          pack(dist / f"taskboard-{tag}.zip", "skills/taskboard", "taskboard")
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" dist/* --target "${{ github.sha }}" --title "$RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
          fi
